name: Gerar instaladores

# Roda quando uma versão é marcada (tag v1.0.0, v1.1.0...) ou manualmente pela aba Actions.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # Se o programa não abrir direito, a versão não é publicada.
      - name: Abrir o programa (Windows)
        if: runner.os == 'Windows'
        run: node scripts/smoke-test.js "dist/win-unpacked/Conversor de Extratos OFX.exe"
      - name: Abrir o programa (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-test.js dist/linux-unpacked/conversor-pdf-ofx --no-sandbox
      - uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ matrix.os }}
          # latest*.yml e .blockmap são lidos pelo programa para saber se há versão nova
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  # Publica mesmo se o Mac falhar (o GitHub às vezes fica sem máquina Mac disponível),
  # mas só se o instalador do Windows tiver sido gerado e testado.
  release:
    needs: build
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true
      - name: Conferir se o instalador do Windows existe
        run: |
          ls -la instaladores
          ls instaladores/*-win-x64.exe instaladores/latest.yml
      - uses: softprops/action-gh-release@v2
        with:
          files: instaladores/*
          generate_release_notes: true
